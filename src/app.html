<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.png" type="image/png" />
		<link rel="shortcut icon" href="/favicon.ico" />
		%sveltekit.head%
		<script>
			// Detect Samsung/Mali devices and browsers synchronously to prevent GPU crashes & text rendering glitches
			(function() {
				var ua = navigator.userAgent;
				var isSamsungBrowser = /SamsungBrowser/i.test(ua);
				var isSamsungDevice = /Samsung/i.test(ua) || /SM-[A-Z0-9]+/i.test(ua);
				var isMali = false;

				// Check via WebGL debug renderer info if available
				try {
					var canvas = document.createElement('canvas');
					var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
					if (gl) {
						var debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
						if (debugInfo) {
							var renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_ID_GI || 37446);
							if (renderer && (/Mali/i.test(renderer) || /Samsung/i.test(renderer))) {
								isMali = true;
							}
						}
					}
				} catch (e) {}

				// Check via modern userAgentData if available
				var isSamsungUAData = false;
				if (navigator.userAgentData && navigator.userAgentData.brands) {
					isSamsungUAData = navigator.userAgentData.brands.some(function(b) {
						return /Samsung/i.test(b.brand);
					});
				}

				var isChromeAndroid = /Chrome/i.test(ua) && /Android/i.test(ua);

				if (isSamsungBrowser || isSamsungDevice || isSamsungUAData || isMali || isChromeAndroid) {
					document.documentElement.classList.add('samsung-device');
				}

				// Svelte 5 polyfill for browsers/webview environments missing standard Node prototype property descriptors
				try {
					var proto = Node.prototype;
					var desc1 = Object.getOwnPropertyDescriptor(proto, 'firstChild');
					if (!desc1 || !desc1.get) {
						Object.defineProperty(proto, 'firstChild', {
							get: function() { return this.childNodes[0] || null; },
							configurable: true,
							enumerable: true
						});
					}
					var desc2 = Object.getOwnPropertyDescriptor(proto, 'nextSibling');
					if (!desc2 || !desc2.get) {
						Object.defineProperty(proto, 'nextSibling', {
							get: function() {
								var sibs = this.parentNode ? this.parentNode.childNodes : [];
								var idx = Array.prototype.indexOf.call(sibs, this);
								return idx !== -1 ? sibs[idx + 1] || null : null;
							},
							configurable: true,
							enumerable: true
						});
					}
				} catch (e) {
					console.warn("Node prototype descriptor polyfill failed:", e);
				}
			})();
		</script>
		<script>
			if ('serviceWorker' in navigator) {
				if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname.startsWith('192.168.')) {
					navigator.serviceWorker.getRegistrations().then(function(registrations) {
						for (var registration of registrations) {
							registration.unregister();
						}
					});
				} else {
					window.addEventListener('load', () => {
						navigator.serviceWorker.register('/service-worker.js')
							.catch(err => console.log('Service Worker registration failed', err));
					});
				}
			}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
